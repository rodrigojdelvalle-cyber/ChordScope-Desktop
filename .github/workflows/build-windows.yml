name: Build ChordScope v2.0.2 CPU + NVIDIA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chordscope-v2.0.2-performance
    paths:
      - 'source.part*.b64'
      - 'patches/**'
      - 'README.md'
      - 'DEVELOPMENT_STATE.md'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: chordscope-v202-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-models:
    name: Prepare + validate shared source/models
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      CHORDSCOPE_BUILD_VARIANT: 'cpu'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and validate source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'source.part*.b64' | Sort-Object Name
          if ($parts.Count -ne 13) { throw "Expected 13 source parts, found $($parts.Count)" }
          $out = [IO.File]::Open('ChordScope_Desktop_V2_0_SOURCE.zip',[IO.FileMode]::Create)
          try {
            foreach ($part in $parts) {
              $raw = Get-Content $part.FullName -Raw
              $clean = [regex]::Replace($raw, '\s', '')
              if ($clean -notmatch '^[A-Za-z0-9+/]*={0,2}$') { throw "Invalid base64 characters in $($part.Name)" }
              if (($clean.Length % 4) -ne 0) { throw "Invalid base64 length in $($part.Name): $($clean.Length)" }
              $chunk = [Convert]::FromBase64String($clean)
              $out.Write($chunk,0,$chunk.Length)
            }
          } finally { $out.Dispose() }
          $zip = Get-Item 'ChordScope_Desktop_V2_0_SOURCE.zip'
          if ($zip.Length -ne 93861) { throw "Unexpected source ZIP size: $($zip.Length), expected 93861" }
          $hash = (Get-FileHash 'ChordScope_Desktop_V2_0_SOURCE.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'f32d083e2d1a890bb721c20131d25e867ed94c899a2e7d48f81a6327444bde02') { throw "Source ZIP checksum mismatch" }
          & tar -xf 'ChordScope_Desktop_V2_0_SOURCE.zip'
          if ($LASTEXITCODE -ne 0) { throw "ZIP extraction failed" }
          if (!(Test-Path 'ChordScope_Desktop_V2_0/requirements.txt')) { throw 'Extracted project missing requirements.txt' }
          if (!(Test-Path 'ChordScope_Desktop_V2_0/chordscope/frontend/index.html')) { throw 'Extracted project missing frontend' }

      - name: Apply v2.0.2 performance/reliability overlays
        shell: pwsh
        run: |
          Copy-Item 'patches/prepare_models.py' 'ChordScope_Desktop_V2_0/prepare_models.py' -Force
          Copy-Item 'patches/requirements.txt' 'ChordScope_Desktop_V2_0/requirements.txt' -Force
          Copy-Item 'patches/main.py' 'ChordScope_Desktop_V2_0/main.py' -Force
          Copy-Item 'patches/apply_frontend_v202.py' 'ChordScope_Desktop_V2_0/apply_frontend_v202.py' -Force
          Copy-Item 'patches/chordscope/app.py' 'ChordScope_Desktop_V2_0/chordscope/app.py' -Force
          Copy-Item 'patches/chordscope/bridge.py' 'ChordScope_Desktop_V2_0/chordscope/bridge.py' -Force
          Copy-Item 'patches/chordscope/runtime_smoke.py' 'ChordScope_Desktop_V2_0/chordscope/runtime_smoke.py' -Force
          Copy-Item 'patches/chordscope/full_runtime_smoke.py' 'ChordScope_Desktop_V2_0/chordscope/full_runtime_smoke.py' -Force
          Copy-Item 'patches/chordscope/analysis/*.py' 'ChordScope_Desktop_V2_0/chordscope/analysis/' -Force
          Copy-Item 'patches/tests/*.py' 'ChordScope_Desktop_V2_0/tests/' -Force
          Push-Location 'ChordScope_Desktop_V2_0'
          python apply_frontend_v202.py
          if ($LASTEXITCODE -ne 0) { throw 'Frontend v2.0.2 patch failed' }
          Pop-Location
          Select-String -Path 'ChordScope_Desktop_V2_0/chordscope/analysis/chord_btc.py' -Pattern 'timeout_seconds' | Write-Host
          Select-String -Path 'ChordScope_Desktop_V2_0/chordscope/analysis/pipeline.py' -Pattern 'btc_mode="adaptive"' | Write-Host
          Select-String -Path 'ChordScope_Desktop_V2_0/chordscope/bridge.py' -Pattern 'signal.connect\(thread.quit\)' | Write-Host
          Select-String -Path 'ChordScope_Desktop_V2_0/chordscope/frontend/index.html' -Pattern 'analysisProfile' | Write-Host

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'ChordScope_Desktop_V2_0/requirements.txt'

      - name: Install CPU dependencies for validation
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU PyTorch install failed' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          python -m pip install pytest
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }

      - name: Compile + unit tests + source runtime smoke
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        run: |
          python -m compileall -q main.py chordscope prepare_models.py apply_frontend_v202.py self_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compile check failed' }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          python self_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Self test failed' }
          python main.py --runtime-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Source runtime smoke test failed' }

      - name: Prepare offline models once
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        timeout-minutes: 90
        run: |
          python prepare_models.py
          if ($LASTEXITCODE -ne 0) { throw "prepare_models.py failed with exit code $LASTEXITCODE" }
          $sum=(Get-ChildItem vendor_models -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Offline models: $([math]::Round($sum/1MB,1)) MB"
          $demucs=(Get-ChildItem vendor_models/demucs -File | Measure-Object).Count
          if ($demucs -lt 5) { throw "Demucs offline repository incomplete: $demucs files" }
          if (!(Test-Path 'vendor_models/btc-chord/btc_model_large_voca.pt')) { throw 'BTC large vocabulary weights missing' }
          if (!(Test-Path 'vendor_models/beat_this/beat_this-final0.ckpt')) { throw 'Beat This checkpoint missing' }
          Remove-Item 'btc_src' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'vendor_models/btc-chord/btc_src' 'btc_src' -Recurse -Force
          if (!(Test-Path 'btc_src/btc_model.py')) { throw 'BTC source package staging failed' }

      - name: Full source ML smoke test
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        timeout-minutes: 35
        run: |
          $marker = Join-Path (Get-Location) 'full_source_smoke.json'
          $env:CHORDSCOPE_FULL_SMOKE_MARKER = $marker
          python main.py --full-runtime-smoke-test
          $code=$LASTEXITCODE
          if (Test-Path $marker) { Get-Content $marker -Raw | Write-Host }
          if ($code -ne 0) { throw 'Full source ML smoke test failed' }

      - name: Create shared offline-model bundle
        shell: pwsh
        run: |
          $bundle='ChordScope_Offline_Bundle_v2.0.2'
          Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item 'ChordScope_Desktop_V2_0/vendor_models' "$bundle/vendor_models" -Recurse -Force
          Copy-Item 'ChordScope_Desktop_V2_0/btc_src' "$bundle/btc_src" -Recurse -Force
          Copy-Item 'ChordScope_Desktop_V2_0/chordscope/data/guitar.json' "$bundle/guitar.json" -Force
          $sum=(Get-ChildItem $bundle -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Shared bundle size: $([math]::Round($sum/1MB,1)) MB"

      - name: Upload shared offline-model bundle
        uses: actions/upload-artifact@v4
        with:
          name: ChordScope-Offline-Bundle-v2.0.2
          path: ChordScope_Offline_Bundle_v2.0.2
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Create compact patched source archive
        shell: pwsh
        run: |
          $src='ChordScope_Desktop_V2_0'
          $tmp='ChordScope_Desktop_V2_0_2_PATCHED_SOURCE'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $exclude=@('vendor_models','dist','__pycache__','.pytest_cache','btc_src')
          Get-ChildItem $src -Force | Where-Object { $exclude -notcontains $_.Name } | ForEach-Object {
            Copy-Item $_.FullName $tmp -Recurse -Force
          }
          Get-ChildItem $tmp -Recurse -Directory -Filter '__pycache__' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $tmp -Recurse -File -Filter '*.pyc' | Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $tmp -DestinationPath 'ChordScope_Desktop_V2_0_2_PATCHED_SOURCE.zip' -CompressionLevel Optimal -Force

      - name: Upload compact patched source
        uses: actions/upload-artifact@v4
        with:
          name: ChordScope-Source-v2.0.2
          path: ChordScope_Desktop_V2_0_2_PATCHED_SOURCE.zip
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  build:
    name: Build ${{ matrix.label }}
    needs: prepare-models
    runs-on: windows-2022
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            label: CPU universal
            torch_index: https://download.pytorch.org/whl/cpu
            exe_name: ChordScope-CPU.exe
            artifact_name: ChordScope-Windows-x64-CPU-v2.0.2
            package_mode: onefile
          - variant: nvidia-cuda
            label: NVIDIA CUDA
            torch_index: https://download.pytorch.org/whl/cu126
            exe_name: ChordScope-NVIDIA-CUDA.exe
            artifact_name: ChordScope-Windows-x64-NVIDIA-CUDA-v2.0.2
            package_mode: standalone
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      CHORDSCOPE_BUILD_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'source.part*.b64' | Sort-Object Name
          if ($parts.Count -ne 13) { throw "Expected 13 source parts, found $($parts.Count)" }
          $out = [IO.File]::Open('ChordScope_Desktop_V2_0_SOURCE.zip',[IO.FileMode]::Create)
          try {
            foreach ($part in $parts) {
              $clean = [regex]::Replace((Get-Content $part.FullName -Raw), '\s', '')
              $chunk = [Convert]::FromBase64String($clean)
              $out.Write($chunk,0,$chunk.Length)
            }
          } finally { $out.Dispose() }
          $hash = (Get-FileHash 'ChordScope_Desktop_V2_0_SOURCE.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'f32d083e2d1a890bb721c20131d25e867ed94c899a2e7d48f81a6327444bde02') { throw "Source ZIP checksum mismatch" }
          & tar -xf 'ChordScope_Desktop_V2_0_SOURCE.zip'
          if ($LASTEXITCODE -ne 0) { throw "ZIP extraction failed" }

      - name: Apply v2.0.2 overlays
        shell: pwsh
        run: |
          Copy-Item 'patches/prepare_models.py' 'ChordScope_Desktop_V2_0/prepare_models.py' -Force
          Copy-Item 'patches/requirements.txt' 'ChordScope_Desktop_V2_0/requirements.txt' -Force
          Copy-Item 'patches/main.py' 'ChordScope_Desktop_V2_0/main.py' -Force
          Copy-Item 'patches/apply_frontend_v202.py' 'ChordScope_Desktop_V2_0/apply_frontend_v202.py' -Force
          Copy-Item 'patches/chordscope/app.py' 'ChordScope_Desktop_V2_0/chordscope/app.py' -Force
          Copy-Item 'patches/chordscope/bridge.py' 'ChordScope_Desktop_V2_0/chordscope/bridge.py' -Force
          Copy-Item 'patches/chordscope/runtime_smoke.py' 'ChordScope_Desktop_V2_0/chordscope/runtime_smoke.py' -Force
          Copy-Item 'patches/chordscope/full_runtime_smoke.py' 'ChordScope_Desktop_V2_0/chordscope/full_runtime_smoke.py' -Force
          Copy-Item 'patches/chordscope/analysis/*.py' 'ChordScope_Desktop_V2_0/chordscope/analysis/' -Force
          Copy-Item 'patches/tests/*.py' 'ChordScope_Desktop_V2_0/tests/' -Force
          Push-Location 'ChordScope_Desktop_V2_0'
          python apply_frontend_v202.py
          if ($LASTEXITCODE -ne 0) { throw 'Frontend v2.0.2 patch failed' }
          Pop-Location

      - name: Download shared offline-model bundle
        uses: actions/download-artifact@v4
        with:
          name: ChordScope-Offline-Bundle-v2.0.2
          path: shared_bundle

      - name: Install shared offline models
        shell: pwsh
        run: |
          Remove-Item 'ChordScope_Desktop_V2_0/vendor_models' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'shared_bundle/vendor_models' 'ChordScope_Desktop_V2_0/vendor_models' -Recurse -Force
          Remove-Item 'ChordScope_Desktop_V2_0/btc_src' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'shared_bundle/btc_src' 'ChordScope_Desktop_V2_0/btc_src' -Recurse -Force
          Copy-Item 'shared_bundle/guitar.json' 'ChordScope_Desktop_V2_0/chordscope/data/guitar.json' -Force

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'ChordScope_Desktop_V2_0/requirements.txt'

      - name: Install ${{ matrix.label }} PyTorch and dependencies
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade torch torchaudio --index-url '${{ matrix.torch_index }}'
          if ($LASTEXITCODE -ne 0) { throw '${{ matrix.label }} PyTorch install failed' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }
          python -c "import torch; print('torch=',torch.__version__,'cuda_build=',torch.version.cuda,'cuda_available=',torch.cuda.is_available())"
          if ($LASTEXITCODE -ne 0) { throw 'Torch import failed' }
          if ('${{ matrix.variant }}' -eq 'cpu') {
            python -c "import torch,sys; sys.exit(0 if torch.version.cuda is None else 3)"
            if ($LASTEXITCODE -ne 0) { throw 'CPU build unexpectedly contains CUDA PyTorch' }
          } else {
            python -c "import torch,sys; sys.exit(0 if torch.version.cuda else 4)"
            if ($LASTEXITCODE -ne 0) { throw 'NVIDIA build does not contain a CUDA-enabled PyTorch wheel' }
          }

      - name: Validate dependency/runtime boundaries
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        run: |
          python -m compileall -q main.py chordscope btc_src
          if ($LASTEXITCODE -ne 0) { throw 'Compile check failed' }
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; from PySide6.QtWebChannel import QWebChannel; print('Qt WebEngine/WebChannel OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Qt boundary failed' }
          python -c "import av, librosa; print('PyAV',av.__version__,'Librosa',librosa.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'PyAV/Librosa boundary failed' }
          python -c "import btc_src.btc_model, beat_this, lv_chordia; from demucs_infer.api import Separator; print('ML package imports OK')"
          if ($LASTEXITCODE -ne 0) { throw 'ML package import boundary failed' }
          python main.py --runtime-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Source runtime smoke test failed for build environment' }

      - name: Restore Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ runner.os }}-py311-${{ matrix.variant }}-${{ hashFiles('patches/**', 'source.part*.b64') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py311-${{ matrix.variant }}-

      - name: Build ChordScope v2.0.2 ${{ matrix.label }} with Nuitka
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        timeout-minutes: 300
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $args = @(
            '--mode=${{ matrix.package_mode }}',
            '--enable-plugin=pyside6',
            '--windows-console-mode=disable',
            '--assume-yes-for-downloads',
            '--no-prefer-source-code',
            '--module-parameter=numba-disable-jit=yes',
            '--module-parameter=torch-disable-jit=yes',
            '--output-dir=dist',
            '--output-filename=${{ matrix.exe_name }}',
            '--product-name=ChordScope',
            '--file-description=ChordScope Desktop 2.0.2 - ${{ matrix.label }}',
            '--file-version=2.0.2.0',
            '--product-version=2.0.2.0',
            '--include-data-dir=chordscope/frontend=chordscope/frontend',
            '--include-data-dir=chordscope/data=chordscope/data',
            '--include-data-dir=vendor_models=vendor_models',
            '--include-package-data=lv_chordia',
            '--include-package-data=beat_this',
            '--include-package-data=demucs_infer',
            '--include-package-data=librosa',
            '--include-package=btc_src',
            '--include-package=lv_chordia',
            '--include-package=beat_this',
            '--include-package=demucs_infer',
            '--include-package=librosa',
            '--include-package=soundfile',
            '--include-package=scipy',
            '--include-package=torch',
            '--include-package=torchaudio',
            '--nofollow-import-to=matplotlib',
            '--nofollow-import-to=pytest',
            '--nofollow-import-to=IPython',
            '--report=dist/nuitka-${{ matrix.variant }}.xml'
          )
          python -m nuitka @args main.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka failed with exit code $LASTEXITCODE" }

      - name: Locate executable + SHA-256
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem 'dist' -Recurse -File -Filter '${{ matrix.exe_name }}')
          if ($matches.Count -lt 1) { throw '${{ matrix.exe_name }} was not produced' }
          $exe = $matches | Sort-Object FullName | Select-Object -First 1
          Write-Host "Executable: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length/1MB,1)) MB"
          if ($exe.Length -lt 10000000) { throw 'Executable is unexpectedly small' }
          $hash=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $shaPath=Join-Path $exe.Directory.FullName ($exe.Name + '.sha256.txt')
          "$hash *$($exe.Name)" | Set-Content -Encoding ascii $shaPath
          Write-Host "SHA256: $hash"
          "CHORDSCOPE_EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHORDSCOPE_EXE_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHORDSCOPE_SHA_PATH=$shaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Packaged basic runtime audio/UI smoke test
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        timeout-minutes: 25
        run: |
          $marker = Join-Path (Get-Location) 'runtime_smoke_ok.json'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:CHORDSCOPE_SMOKE_MARKER = $marker
          $env:CHORDSCOPE_BUILD_VARIANT = '${{ matrix.variant }}'
          $proc = Start-Process -FilePath $env:CHORDSCOPE_EXE_PATH -ArgumentList '--runtime-smoke-test' -Wait -PassThru
          $code=$proc.ExitCode
          if (Test-Path $marker) { $text=Get-Content $marker -Raw; Write-Host $text } else { $text='' }
          if ($code -ne 0) { throw "Packaged basic smoke failed with exit code $code" }
          if (!(Test-Path $marker)) { throw 'Packaged executable did not write basic smoke marker' }
          $j = $text | ConvertFrom-Json
          if ($j.status -ne 'CHORDSCOPE_RUNTIME_SMOKE_OK') { throw "Basic smoke status: $($j.status)" }
          if ($j.librosa_external_cqt -ne 'ok') { throw 'External Librosa CQT compatibility smoke missing' }
          if ($j.pyav -notlike 'ok:*') { throw 'Packaged PyAV smoke missing' }
          if ($j.build_variant -ne '${{ matrix.variant }}') { throw "Build variant mismatch: $($j.build_variant)" }
          if ('${{ matrix.variant }}' -eq 'cpu' -and $null -ne $j.torch_cuda_build) { throw 'CPU packaged smoke reports CUDA build' }
          if ('${{ matrix.variant }}' -eq 'nvidia-cuda' -and -not $j.torch_cuda_build) { throw 'NVIDIA packaged smoke lacks CUDA runtime' }

      - name: Packaged full ML smoke test
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        timeout-minutes: 55
        run: |
          $marker = Join-Path (Get-Location) 'full_runtime_smoke_ok.json'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:CHORDSCOPE_FULL_SMOKE_MARKER = $marker
          $env:CHORDSCOPE_BUILD_VARIANT = '${{ matrix.variant }}'
          $proc = Start-Process -FilePath $env:CHORDSCOPE_EXE_PATH -ArgumentList '--full-runtime-smoke-test' -Wait -PassThru
          $code=$proc.ExitCode
          if (Test-Path $marker) {
            $text=Get-Content $marker -Raw
            Write-Host '===== PACKAGED FULL ML MARKER ====='
            Write-Host $text
          } else {
            $text=''
            Write-Host 'No full ML marker was produced.'
          }
          if ($code -ne 0) {
            if ($text) {
              try { $fail=$text | ConvertFrom-Json; throw "Packaged full ML smoke failed at stage '$($fail.stage)': $($fail.error_type): $($fail.error)" } catch [System.Management.Automation.RuntimeException] { throw }
            }
            throw "Packaged full ML smoke failed with exit code $code and no marker"
          }
          if (!(Test-Path $marker)) { throw 'Packaged executable did not write full ML smoke marker' }
          $j = $text | ConvertFrom-Json
          if ($j.status -ne 'CHORDSCOPE_FULL_ML_RUNTIME_SMOKE_OK') { throw "Full ML smoke status: $($j.status), stage=$($j.stage)" }
          foreach ($field in @('demucs_model','beat_this_model','lv_chordia_model','btc_model','btc_isolation')) {
            if ($j.$field -ne 'ok') { throw "$field smoke missing" }
          }
          if ($j.build_variant -ne '${{ matrix.variant }}') { throw "Full smoke variant mismatch: $($j.build_variant)" }

      - name: Stage successful package
        working-directory: ChordScope_Desktop_V2_0
        shell: pwsh
        run: |
          $pkg='package-output'
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          if ('${{ matrix.package_mode }}' -eq 'standalone') {
            $dest=Join-Path $pkg 'ChordScope-NVIDIA-CUDA'
            Copy-Item $env:CHORDSCOPE_EXE_DIR $dest -Recurse -Force
          } else {
            Copy-Item $env:CHORDSCOPE_EXE_PATH $pkg -Force
            Copy-Item $env:CHORDSCOPE_SHA_PATH $pkg -Force
          }
          Copy-Item 'runtime_smoke_ok.json' $pkg -Force
          Copy-Item 'full_runtime_smoke_ok.json' $pkg -Force
          Copy-Item 'dist/nuitka-${{ matrix.variant }}.xml' $pkg -Force -ErrorAction SilentlyContinue
          if ('${{ matrix.package_mode }}' -eq 'standalone') {
            Copy-Item $env:CHORDSCOPE_SHA_PATH $pkg -Force
          }
          $sum=(Get-ChildItem $pkg -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Package staged: $([math]::Round($sum/1MB,1)) MB"

      - name: Upload ${{ matrix.artifact_name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ChordScope_Desktop_V2_0/package-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ChordScope-Diagnostics-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            ChordScope_Desktop_V2_0/runtime_smoke_ok.json
            ChordScope_Desktop_V2_0/full_runtime_smoke_ok.json
            ChordScope_Desktop_V2_0/dist/nuitka-${{ matrix.variant }}.xml
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 14
